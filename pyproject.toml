[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gacha-companion"
version = "0.1.0"
description = "Local-first, game-agnostic Gacha Companion framework (ZZZ as first reference implementation)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "nick" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
game-companion = "game_companion.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["game_companion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",   # long lines are fine for prompt strings/docs
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "UP042",  # str+Enum kept for SQLAlchemy JSON serialization clarity
    "UP046",  # typing.Generic is clearer for the repository base here
]
